name: Auto create a PR

permissions:
  contents: write
  pull-requests: write

on:
  workflow_call:
    inputs:
      base:
        description: "The base branch"
        required: true
        type: string
      head:
        description: "The head branch"
        required: true
        type: string

jobs:
  auto-create-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Create PR between two branches
        run: |
          gh pr list \
            --head ${{ inputs.head }} \
            --base ${{ inputs.base }}  \
            --json number \
            --jq '.[].number' \
          || gh pr create \
              --head ${{ inputs.head }} \
              --base ${{ inputs.base }} \
              --title "Sync ${{ inputs.head }} to ${{ inputs.base }}" \
              --body "Automated PR to sync ${{ inputs.head }} into ${{ inputs.base }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}