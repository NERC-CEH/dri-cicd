# Simple workflow for deploying static content to GitHub Pages
name: Documentation Building

on:
  workflow_call:
    inputs:
      pages_artifact_name:
        description: "Name of pages artifact"
        required: false
        type: string
        default: "pages-artifact"
      pages_html_dir:
        description: "Directory of pages html"
        required: false
        type: string
        default: "docs/_build/html"
      use_uv:
        description: "Whether to use uv to fetch Python dependencies."
        required: false
        type: boolean
        default: false
      private_repos:
        description: Set up access to private repositories
        required: false
        type: boolean
        default: false
    outputs:
      pages_artifact_name:
        description: "Name of artifact containing the pages"
        value: ${{ inputs.pages_artifact_name }}

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_artifact_name:
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        # This is the version of the action for setting up Python, not the Python version.
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        if: ${{ inputs.use_uv }}
        uses: astral-sh/setup-uv@v5
      - name: Get access token for private repos
        if: ${{ inputs.private_repos }}
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - name: Set up access for private repos
        if: ${{ inputs.private_repos }}
        run: |
          echo "${{ steps.app-token.outputs.token }}" | gh auth login --with-token
          gh auth setup-git
      - name: Install dependencies
        run: |
          if [ ${{ inputs.use_uv }} = true ]; then
            uv sync --locked --all-extras --dev
            echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
            echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          else
            python -m pip install --upgrade pip
            python -m pip install .[docs]
          fi
      - name: Build Docs
        run: |
          pushd docs
          make html
      - name: Upload pages directory as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.pages_artifact_name }}
          path: ${{ inputs.pages_html_dir }}
